name: lintdec

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Each job's timeout is about three times its slowest recent success, so a hung step fails in minutes.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The sloplint diff gate needs the full history to diff against the base ref.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # tree-sitter is cgo; the runner ships gcc, so no extra install.
      - run: go vet ./...
      - run: go test ./... -coverprofile=cover-root.out
      - run: go test ./tools/sloplint -coverprofile=cover-sloplint.out
      # Floor set from the first measured run (2026-11-21: 10.5% / 63.7%); raise as tests land.
      - run: |
          total() { go tool cover -func="$1" | awk '/^total:/{print $3}' | tr -d '%'; }
          root=$(total cover-root.out)
          slop=$(total cover-sloplint.out)
          echo "coverage: root ${root}%  sloplint ${slop}%"
          awk -v t="$root" 'BEGIN{exit !(t+0 >= 10)}'
          awk -v t="$slop" 'BEGIN{exit !(t+0 >= 60)}'
      # Gates only lines this change touches.
      - if: github.event_name == 'pull_request'
        run: go run ./tools/sloplint diff origin/${{ github.base_ref }}

  # Each green push to main cuts the next patch tag; release.yaml runs goreleaser on it.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags must be visible, or the bump always restarts at v0.1.0.
          fetch-tags: true
      - name: Bump patch version and tag
        run: |
          # The tag carries this run's commit, whose tree predates the tag job's own
          # workflow files; backport them so the tag push has workflows to run.
          for f in .github/workflows/release.yaml .goreleaser.yaml; do
            mkdir -p "$(dirname "$f")"
            curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/main/$f" -o "$f"
          done
          git config user.name github-actions
          git config user.email github-actions@github.com
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ]; then
            v=${last#v}
            next=$(printf 'v%s.%s.%s' "$(echo "$v" | cut -d. -f1)" "$(echo "$v" | cut -d. -f2)" "$(( $(echo "$v" | cut -d. -f3) + 1 ))")
          else
            next=v0.1.0
          fi
          git add .github/workflows/release.yaml .goreleaser.yaml
          git diff --cached --quiet || git commit -m "cd: backport the release workflow and goreleaser config to this tag"
          git tag -a "$next" -m "lintdec $next"
          git push origin "$next"
          echo "tagged $next"
