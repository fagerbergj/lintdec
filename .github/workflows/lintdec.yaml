name: lintdec

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Each job's timeout is about three times its slowest recent success, so a hung step fails in minutes.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The sloplint diff gate needs the full history to diff against the base ref.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # tree-sitter is cgo; the runner ships gcc, so no extra install.
      - run: go vet ./...
      - run: go test ./... -coverprofile=cover-root.out
      - run: go test ./tools/sloplint -coverprofile=cover-sloplint.out
      # Floor set from the first measured run (2026-11-21: 10.5% / 63.7%); raise as tests land.
      - run: |
          total() { go tool cover -func="$1" | awk '/^total:/{print $3}' | tr -d '%'; }
          root=$(total cover-root.out)
          slop=$(total cover-sloplint.out)
          echo "coverage: root ${root}%  sloplint ${slop}%"
          awk -v t="$root" 'BEGIN{exit !(t+0 >= 10)}'
          awk -v t="$slop" 'BEGIN{exit !(t+0 >= 60)}'
      # Gates only lines this change touches.
      - if: github.event_name == 'pull_request'
        run: go run ./tools/sloplint diff origin/${{ github.base_ref }}

  # Each green push to main publishes the CLI, pinned by commit under a single `latest` release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build \
            -ldflags "-s -w -X main.version=${GITHUB_SHA:0:7}" \
            -o dist/lintdec .
      - name: Release
        run: |
          ./dist/lintdec version
          (sha256sum dist/lintdec > dist/lintdec.sha256) < dist/lintdec
          gh release delete latest --yes >/dev/null 2>&1 || true
          gh release create latest dist/lintdec dist/lintdec.sha256 \
            --title "lintdec ${GITHUB_SHA:0:7}" \
            --notes "commit $GITHUB_SHA"
          gh release download latest --pattern 'lintdec*' --dir dist/check
          (cd dist/check && sha256sum -c lintdec.sha256)
          dist/check/lintdec version
