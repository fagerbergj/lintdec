# golangci-lint v2 config — standard linters + curated bug/anti-slop checks.
version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - makezero
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint

  settings:
    errcheck:
      # Terminal/stderr prints are unhandleable in this CLI; keep Close/file writes checked.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    warn-unused: true
    presets: []
    rules:
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - gosec
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
